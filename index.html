<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JobStart India</title>
<style>
body{margin:0;font-family:Arial;background:#f5f7fb;color:#172033}
header{background:#0b57d0;color:white;padding:25px 18px;border-radius:0 0 22px 22px}
main{padding:16px}
input,select,button{width:100%;padding:13px;margin:6px 0;border-radius:10px;box-sizing:border-box}
input,select{border:1px solid #ddd}
button{background:#0b57d0;color:white;border:0}
.card{background:white;padding:16px;margin:12px 0;border-radius:15px}
h1{margin:0}
</style>
</head>

<body>

<header>
<h1>JobStart India 🇮🇳</h1>
<p>Your First Job Starts Here.</p>
</header>

<main>

<input id="search" placeholder="Search jobs..." oninput="showJobs()">

<select id="city" onchange="showJobs()">
<option>All Cities</option>
<option>Mumbai</option>
<option>Delhi</option>
<option>Pune</option>
<option>Bengaluru</option>
</select>

<div id="jobs"></div>

<div class="card">
<h2>📄 Resume Builder</h2>
<input id="name" placeholder="Full Name">
<input id="education" placeholder="Education">
<input id="skills" placeholder="Skills">
<button onclick="resume()">Create Resume</button>
<div id="resume"></div>
</div>

<div class="card">
<h2>✉️ Cover Letter</h2>
<input id="role" placeholder="Job Role">
<input id="company" placeholder="Company Name">
<button onclick="cover()">Generate Cover Letter</button>
<div id="cover"></div>
</div>
<div class="card">
  <h2>🔎 Job Search</h2>

  <input id="search" placeholder="Job ya company search karo">

  <select id="city">
    <option>All Cities</option>
    <option>Mumbai</option>
  </select>
</div>

<div id="jobs"></div>

<div class="card">
  <h2>🤖 AI Job Assistant</h2>

  <input id="aiQuestion"
         placeholder="Job ke baare me question poochho">

  <button onclick="askAI()">Ask AI</button>

  <p id="aiAnswer">
    Namaste! Main JobStart India AI Assistant hoon 🤖
  </p>
</div>
</main>

<script>

<script>
const jobs = [
  ["Airport Ground Staff","Mumbai","Airport","₹18,000–₹28,000",
   "https://careers.adani.com/"],

  ["AI Airport Services Jobs","Mumbai","AI Airport Services","As per notification",
   "https://www.aiasl.in/Recruitment"],

  ["Security Screener / Airport Security","Mumbai","Security","As per notification",
   "https://www.aiasl.in/Recruitment"],

  ["Passenger Service Agent","Mumbai","Airport","As per notification",
   "https://www.aiasl.in/Recruitment"],

  ["Airport Ticketing Executive","Mumbai","Airport","₹18,000–₹30,000",
   "https://careers.adani.com/"]
];

function showJobs(){

  let q = document.getElementById("search").value.toLowerCase();
  let city = document.getElementById("city").value;

  let result = jobs.filter(j =>
    (city === "All Cities" || j[1] === city) &&
    j.join(" ").toLowerCase().includes(q)
  );

  document.getElementById("jobs").innerHTML = result.map(j => `
    <div class="card">

      <h3>${j[0]}</h3>

      <p>📍 ${j[1]}</p>
      <p>💼 ${j[2]}</p>
      <p>💰 ${j[3]}</p>

      <button onclick="applyJob('${j[4]}')">
        Apply Now
      </button>

    </div>
  `).join("");

}

function applyJob(url){
  window.open(url, "_blank");
}


/* 🤖 AI JOB ASSISTANT */

function askAI(){

  let question = document.getElementById("aiQuestion").value
    .toLowerCase()
    .trim();

  let answer = "";

  if(!question){
    answer = "Apna question likho. Example: Airport job ke liye qualification kya chahiye?";
  }

  else if(question.includes("resume")){
    answer = "AI Assistant aapke liye Resume Objective, Skills aur basic resume format banane me help kar sakta hai.";
  }

  else if(question.includes("interview")){
    answer = "Airport interview ke liye common questions: Tell me about yourself, Why do you want this job?, Strengths, Weaknesses aur customer handling.";
  }

  else if(question.includes("airport")){
    answer = "Airport jobs me Ground Staff, Passenger Service, Ticketing, Security aur Ramp Services jaise roles mil sakte hain.";
  }

  else if(question.includes("aiasl") || question.includes("air india")){
    answer = "AI Airport Services Limited ki official recruitment notifications ke liye AIASL Recruitment page check karein.";
  }

  else if(question.includes("eligibility") || question.includes("qualification")){
    answer = "Eligibility har vacancy ke notification par depend karti hai. Apply karne se pehle official employer notification zaroor check karein.";
  }

  else if(question.includes("salary")){
    answer = "Salary company, job role, location aur experience ke according alag hoti hai. Official vacancy notification ko priority dein.";
  }

  else if(question.includes("cover letter")){
    answer = "Cover Letter ke liye apni qualification, job role aur location batao. AI Assistant uska draft bana sakta hai.";
  }

  else {
    answer = "Main JobStart India AI Assistant hoon 🤖. Aap job, resume, interview, eligibility, salary ya cover letter ke baare me pooch sakte ho.";
  }

  document.getElementById("aiAnswer").innerText = answer;
}


/* Page load par jobs dikhao */
showJobs();

</script>

</body>
</html>
